[project]
name = "linkedin-messages-cli"
version = "0.4.1"
description = "Unofficial agent-native CLI for LinkedIn messaging, image posts (dry-run by default), read-only activity export, and read-only Boost stats (Chrome session)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "True Frontier" }]
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
limsg = "limsg_cli.cli:main"
linkedin-messages = "limsg_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["limsg_cli"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
